url: https://ieco-lab.github.io/scari/
template:
  bootstrap: 5
  bootswatch: united
development:
  mode: auto
home:
  links:
  - text: iEco Lab
    href: https://www.iecolab.org
  - text: Center for Biodiversity
    href: https://www.biodiversitycenter.org
  - text: Temple University Biology
    href: https://cst.temple.edu/department-biology
navbar:
  structure: # the structure is used as a placeholder
    left:
    - home
    - intro
    - examples
    - articles
    - create_reports # this is a custom component
    right:
    - reference
    - news
    - search
    - github
  components: # the components are used to define details about each structural member
    home:
      icon: fa-home fa-lg
      href: index.html
      aria-label: Home
    articles:
      text: Analyses
      href: articles/articles_index.html
    create_reports:
      text: Create Reports
      href: articles/reports_index.html
    reference:
      text: Reference
      href: reference/index.html
    github:
      icon: fa-github fa-lg
      aria-label: GitHub
      href: https://github.com/ieco-lab/scari
    news:
      text: Changelog
      href: news/index.html
search:
  exclude: news/index.html
reference:
- title: Import data for SDM
  contents: import_chelsa_v2
- title: Create localized risk reports
  desc: Quantify SLF risk to viticultural areas at the state/provincial or country.
    level
  contents: create_risk_report
- title: Global-scale MaxEnt model functions (for those using cross-validation)
  desc: Calculate summary statistics, predict risk via maps or point-wise predictions
  contents:
  - compute_MaxEnt_summary_statistics_CV
  - create_MaxEnt_suitability_maps_CV
  - predict_xy_suitability_CV
- title: Regional-scale MaxEnt model functions (for those without cross validation)
  desc: Calculate summary statistics, predict risk via maps or point-wise predictions
  contents:
  - compute_MaxEnt_summary_statistics
  - create_MaxEnt_suitability_maps
  - predict_xy_suitability
- title: Quadrant plot functions
  desc: Helper functions to format point-wise suitability predictions for visualization
    in quadrant plots
  contents:
  - rescale_cloglog_suitability
  - calculate_risk_quadrant


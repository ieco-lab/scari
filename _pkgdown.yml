url: https://ieco-lab.github.io/scari/
template:
  bootstrap: 5
  bootswatch: united
development:
  mode: auto
home:
  links:
  - text: iEco Lab
    href: https://www.iecolab.org
  - text: iEco's GitHub
    href: https://github.com/ieco-lab
  - text: Center for Biodiversity
    href: https://www.biodiversitycenter.org
  - text: Temple University Biology
    href: https://cst.temple.edu/department-biology
navbar:
  structure:
    left:
    - intro
    - articles
    right:
    - reference
    - news
    - search
  components:
    left:
    - icon: fa-home fa-lg
    right:
    - icon: fa-github fa-lg
      href: https://github.com/ieco_lab/scari
search:
  exclude: news/index.html
